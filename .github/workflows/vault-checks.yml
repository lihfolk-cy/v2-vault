name: Vault checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      LUAU_VERSION: "0.744"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Indexes and TL;DRs are up to date
        run: python "LihFolk Vault V2/_tools/build_index.py" --check
      - name: Every Roblox and Luau API name is real and current
        run: python "LihFolk Vault V2/_tools/api_check.py" --strict
      - name: Install Luau
        run: |
          curl -sSL -o luau.zip "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          unzip -q luau.zip -d "$HOME/luau"
          echo "LUAU_COMPILE=$HOME/luau/luau-compile" >> "$GITHUB_ENV"
      - name: Every Luau snippet compiles
        run: python "LihFolk Vault V2/_tools/snippets.py" --strict
      - name: No contradicting numbers between notes
        run: python "LihFolk Vault V2/_tools/consistency.py" --strict
      - name: Search finds the right note (held-out test set, top 3)
        run: python "LihFolk Vault V2/_tools/eval.py" --min-hit3 0.85
